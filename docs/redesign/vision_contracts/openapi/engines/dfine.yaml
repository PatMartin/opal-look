  /api/v1/job/{job_id}/logs:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/jobs_logs
  /api/v1/artifact/{artifact_id}:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/artifact_item
  /api/v1/artifact/{artifact_id}/content:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/artifact_content
  /api/v1/execution/:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/executions
  /api/v1/execution/{execution_id}:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/execution_item
  /api/v1/execution/{execution_id}/manifest:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/execution_manifest
  /api/v1/execution/{execution_id}/reproduce:
    $ref: ../shared/vision_kernel.yaml#/components/pathItems/execution_reproduce
  /api/v1/predict:
    parameters:
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter
    x-opal-cli:
      post:
        command: predict
    post:
      tags:
      - inference
      operationId: dfine_predict
      summary: D-FINE predict
      description: Common operation semantics, specialized request schema. Reject unadvertised engine options with
        422.
      x-opal-cli:
        command: predict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DfinePredictRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Opal-Session-Id: &id001
              $ref: ../shared/opal_kernel.yaml#/components/headers/OpalSessionIdHeader
            X-Opal-Transaction-Id: &id002
              $ref: ../shared/opal_kernel.yaml#/components/headers/OpalTransactionIdHeader
            X-Opal-Request-Id: &id003
              $ref: ../shared/opal_kernel.yaml#/components/headers/OpalRequestIdHeader
            X-Opal-Causation-Id: &id004
              $ref: ../shared/opal_kernel.yaml#/components/headers/OpalCausationIdHeader
          content:
            application/json:
              schema:
                $ref: ../shared/vision_kernel.yaml#/components/schemas/PredictionResult
        '400':
          $ref: ../shared/opal_kernel.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/opal_kernel.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/opal_kernel.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/opal_kernel.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/opal_kernel.yaml#/components/responses/UnprocessableEntity
        '429':
          $ref: ../shared/opal_kernel.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../shared/opal_kernel.yaml#/components/responses/ServiceUnavailable
        '413':
          $ref: ../shared/opal_kernel.yaml#/components/responses/PayloadTooLarge
  /api/v1/train/:
    parameters:
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalSessionIdParameter
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalTransactionIdParameter
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalRequestIdParameter
    - $ref: ../shared/opal_kernel.yaml#/components/parameters/OpalCausationIdParameter
    x-opal-cli:
      post:
        command: train
    post:
      tags:
      - training
      operationId: dfine_train
      summary: D-FINE train
      description: Common operation semantics, specialized request schema. Reject unadvertised engine options with
        422.
      x-opal-cli:
        command: train
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DfineTrainRequest'
      responses:
        '202':
          description: Operation accepted.
          headers:
            X-Opal-Session-Id: *id001
            X-Opal-Transaction-Id: *id002
            X-Opal-Request-Id: *id003
            X-Opal-Causation-Id: *id004
            Location:
              $ref: ../shared/opal_kernel.yaml#/components/headers/Location
          content:
            application/json:
              schema:
                $ref: ../shared/vision_kernel.yaml#/components/schemas/VisionJob
        '400':
          $ref: ../shared/opal_kernel.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/opal_kernel.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/opal_kernel.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/opal_kernel.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/opal_kernel.yaml#/components/responses/UnprocessableEntity
        '429':
          $ref: ../shared/opal_kernel.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../shared/opal_kernel.yaml#/components/responses/ServiceUnavailable
      parameters:
      - $ref: ../shared/opal_kernel.yaml#/components/parameters/IdempotencyKey
  /api/v1/validate/:

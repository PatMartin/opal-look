openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL-compatible D-FINE Standalone REST Adapter
  version: 0.1.0-draft
  description: Contract-first adapter for D-FINE; independently deployable with no opal-look or opal-devices runtime
    dependency. Shared vision domain semantics derive from vision_kernel.yaml and suite-wide conventions from opal_kernel.yaml.
    FDR and GO-LSD are architecture/training mechanisms, not assumed request-time inference switches.
servers:
- url: http://127.0.0.1:8000
  description: Illustrative loopback server; host/port configured by deployment
tags:
- name: capabilities
- name: engines
- name: models
- name: inference
- name: training
- name: deployment
- name: benchmark
- name: jobs
- name: runtimes
- name: artifacts
- name: executions
x-vision-engine:
  family: dfine
  supported_task_families:
  - detect
  native_operations: []
  capability_gating: true
security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      $ref: ../shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth
  schemas:
    DfinePredictOptions:
      type: object
      properties:
        postprocess_config:
          type: string
      additionalProperties: false
      description: D-FINE predict extension options. All fields conditional on engine/model/runtime capabilities.
    DfinePredictRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/PredictionCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/DfinePredictOptions'
        additionalProperties: true
      description: Common predict request, extended with typed dfine options.
    DfineTrainOptions:
      type: object
      properties:
        config_uri:
          type: string
        teacher_checkpoint:
          type: string
        distributed:
          type: boolean
      additionalProperties: false
      description: D-FINE train extension options. All fields conditional on engine/model/runtime capabilities.
    DfineTrainRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/TrainingCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/DfineTrainOptions'
        additionalProperties: true
      description: Common train request, extended with typed dfine options.
    DfineValidateOptions:
      type: object
      properties:
        coco_metrics:
          type: boolean
      additionalProperties: false
      description: D-FINE validate extension options. All fields conditional on engine/model/runtime capabilities.
    DfineValidateRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/ValidationCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/DfineValidateOptions'
        additionalProperties: true
      description: Common validate request, extended with typed dfine options.
    DfineExportOptions:
      type: object
      properties:
        exporter_config:
          type: string
      additionalProperties: false
      description: D-FINE export extension options. All fields conditional on engine/model/runtime capabilities.
    DfineExportRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/ExportCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/DfineExportOptions'
        additionalProperties: true
      description: Common export request, extended with typed dfine options.
    DfineBenchmarkOptions:
      type: object
      properties:
        profile_layers:
          type: boolean
      additionalProperties: false
      description: D-FINE benchmark extension options. All fields conditional on engine/model/runtime capabilities.
    DfineBenchmarkRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/BenchmarkCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/DfineBenchmarkOptions'
        additionalProperties: true
      description: Common benchmark request, extended with typed dfine options.

openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL-compatible Roboflow RF-DETR Standalone REST Adapter
  version: 0.1.0-draft
  description: Contract-first adapter for Roboflow RF-DETR; independently deployable with no opal-look or opal-devices
    runtime dependency. Shared vision domain semantics derive from vision_kernel.yaml and suite-wide conventions
    from opal_kernel.yaml. Pose/keypoint functionality is preview/model-dependent; every operation is capability
    gated.
servers:
- url: http://127.0.0.1:8000
  description: Illustrative loopback server; host/port configured by deployment
tags:
- name: capabilities
- name: engines
- name: models
- name: inference
- name: training
- name: deployment
- name: benchmark
- name: jobs
- name: runtimes
- name: artifacts
- name: executions
x-vision-engine:
  family: rfdetr
  supported_task_families:
  - detect
  - segment
  - pose
  native_operations: []
  capability_gating: true
security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      $ref: ../shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth
  schemas:
    RfdetrPredictOptions:
      type: object
      properties:
        resolution:
          type: integer
          minimum: 1
        threshold:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
      description: Roboflow RF-DETR predict extension options. All fields conditional on engine/model/runtime capabilities.
    RfdetrPredictRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/PredictionCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/RfdetrPredictOptions'
        additionalProperties: true
      description: Common predict request, extended with typed rfdetr options.
    RfdetrTrainOptions:
      type: object
      properties:
        gradient_accumulation_steps:
          type: integer
          minimum: 1
        learning_rate:
          type: number
          exclusiveMinimum: 0
        early_stopping:
          type: boolean
      additionalProperties: false
      description: Roboflow RF-DETR train extension options. All fields conditional on engine/model/runtime capabilities.
    RfdetrTrainRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/TrainingCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/RfdetrTrainOptions'
        additionalProperties: true
      description: Common train request, extended with typed rfdetr options.
    RfdetrValidateOptions:
      type: object
      properties:
        evaluation_config:
          type: string
      additionalProperties: false
      description: Roboflow RF-DETR validate extension options. All fields conditional on engine/model/runtime capabilities.
    RfdetrValidateRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/ValidationCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/RfdetrValidateOptions'
        additionalProperties: true
      description: Common validate request, extended with typed rfdetr options.
    RfdetrExportOptions:
      type: object
      properties:
        input_shape:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 2
          maxItems: 2
      additionalProperties: false
      description: Roboflow RF-DETR export extension options. All fields conditional on engine/model/runtime capabilities.
    RfdetrExportRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/ExportCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/RfdetrExportOptions'
        additionalProperties: true
      description: Common export request, extended with typed rfdetr options.
    RfdetrBenchmarkOptions:
      type: object
      properties:
        amp:
          type: boolean
      additionalProperties: false
      description: Roboflow RF-DETR benchmark extension options. All fields conditional on engine/model/runtime
        capabilities.
    RfdetrBenchmarkRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/BenchmarkCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/RfdetrBenchmarkOptions'
        additionalProperties: true
      description: Common benchmark request, extended with typed rfdetr options.

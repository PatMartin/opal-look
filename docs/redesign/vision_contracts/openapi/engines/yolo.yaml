openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OPAL-compatible Ultralytics YOLO Standalone REST Adapter
  version: 0.1.0-draft
  description: 'Contract-first adapter for Ultralytics YOLO; independently deployable with no opal-look or opal-devices
    runtime dependency. Shared vision domain semantics derive from vision_kernel.yaml and suite-wide conventions
    from opal_kernel.yaml. '
servers:
- url: http://127.0.0.1:8000
  description: Illustrative loopback server; host/port configured by deployment
tags:
- name: capabilities
- name: engines
- name: models
- name: inference
- name: training
- name: deployment
- name: benchmark
- name: jobs
- name: runtimes
- name: artifacts
- name: executions
x-vision-engine:
  family: yolo
  supported_task_families:
  - detect
  - segment
  - classify
  - pose
  - obb
  native_operations:
  - track
  - tune
  - solutions
  capability_gating: true
security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      $ref: ../shared/opal_kernel.yaml#/components/securitySchemes/BearerAuth
  schemas:
    YoloPredictOptions:
      type: object
      properties:
        augment:
          type: boolean
        retina_masks:
          type: boolean
        agnostic_nms:
          type: boolean
        max_det:
          type: integer
          minimum: 1
        half:
          type: boolean
      additionalProperties: false
      description: Ultralytics YOLO predict extension options. All fields conditional on engine/model/runtime capabilities.
    YoloPredictRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/PredictionCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/YoloPredictOptions'
        additionalProperties: true
      description: Common predict request, extended with typed yolo options.
    YoloTrainOptions:
      type: object
      properties:
        optimizer:
          type: string
        freeze_layers:
          type: array
          items:
            type: integer
            minimum: 0
        cos_lr:
          type: boolean
        patience:
          type: integer
          minimum: 0
      additionalProperties: false
      description: Ultralytics YOLO train extension options. All fields conditional on engine/model/runtime capabilities.
    YoloTrainRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/TrainingCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/YoloTrainOptions'
        additionalProperties: true
      description: Common train request, extended with typed yolo options.
    YoloValidateOptions:
      type: object
      properties:
        plots:
          type: boolean
        save_json:
          type: boolean
      additionalProperties: false
      description: Ultralytics YOLO validate extension options. All fields conditional on engine/model/runtime capabilities.
    YoloValidateRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/ValidationCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/YoloValidateOptions'
        additionalProperties: true
      description: Common validate request, extended with typed yolo options.
    YoloExportOptions:
      type: object
      properties:
        dynamic:
          type: boolean
        simplify:
          type: boolean
        opset:
          type: integer
          minimum: 1
      additionalProperties: false
      description: Ultralytics YOLO export extension options. All fields conditional on engine/model/runtime capabilities.
    YoloExportRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/ExportCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/YoloExportOptions'
        additionalProperties: true
      description: Common export request, extended with typed yolo options.
    YoloBenchmarkOptions:
      type: object
      properties:
        half:
          type: boolean
        int8:
          type: boolean
      additionalProperties: false
      description: Ultralytics YOLO benchmark extension options. All fields conditional on engine/model/runtime
        capabilities.
    YoloBenchmarkRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/BenchmarkCore
      - type: object
        properties:
          engine_options:
            $ref: '#/components/schemas/YoloBenchmarkOptions'
        additionalProperties: true
      description: Common benchmark request, extended with typed yolo options.
    YoloTrackRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/PredictionCore
      - type: object
        properties:
          tracker:
            type: string
            enum:
            - bytetrack
            - botsort
          persist:
            type: boolean
          tracker_config_uri:
            type: string
        additionalProperties: true
    YoloTuneRequest:
      allOf:
      - $ref: ../shared/vision_kernel.yaml#/components/schemas/TrainingCore
      - type: object
        properties:
          iterations:
            type: integer
            minimum: 1
          space:
            type: object
            properties: {}
            additionalProperties: true
        additionalProperties: true
    YoloSolutionRequest:
      type: object
      properties:
        solution_id:
          type: string
        source:
          $ref: ../shared/vision_kernel.yaml#/components/schemas/VisionSource
        model_id:
          type: string
        options:
          type: object
          properties: {}
          additionalProperties: true
      additionalProperties: false
      required:
      - solution_id
      - source
      - model_id

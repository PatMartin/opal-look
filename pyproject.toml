[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opal_look", "src/opal_look_cli"]

[project]
name = "opal-look"
version = "0.1.0"
description = "OPAL Look vision service (contract opal_look_v1.7.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "Pillow>=10",
    "av>=12",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
opal = "opal_look_cli.opal:main"
opal-look = "opal_look_cli.cli:main"
opal-look-audit = "opal_look.contract_audit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
